<script id="force-light">
/* ----- run BEFORE wc-color-mode.js ----- */
(function () {
  const root = document.documentElement;

  /* 1. Tell the helper that the user “prefers” light */
  localStorage.setItem('wcPreferredColorMode', 'light');   // Tailwind key
  localStorage.setItem('wc-color-mode',        'light');   // Legacy key

  /* 2. Make sure the dark flags are gone right now            */
  root.classList.remove('dark');
  root.dataset.theme = 'light';
  root.style.colorScheme = 'light';

  /* 3. Belt-and-braces: stop any later script re-adding .dark */
  const { add, toggle } = root.classList;
  root.classList.add = (...cls) => add.apply(root.classList, cls.filter(c => c !== 'dark'));
  root.classList.toggle = (c, force) => c === 'dark' ? false : toggle.call(root.classList, c, force);
})();
</script>
